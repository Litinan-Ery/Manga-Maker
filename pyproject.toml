[project]
name = "manga-maker"
version = "0.2.0"
description = "Local-first workflow for adapting authorized TXT novels into editable manga projects."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=25.1.0,<26",
  "charset-normalizer>=3.4.3,<4",
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "pillow>=11.3.0,<12",
  "pydantic-settings>=2.10.1,<3",
  "pynacl>=1.5.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "pytest-xdist>=3.8.0,<4",
  "ruff>=0.12.8,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["frontend"]
